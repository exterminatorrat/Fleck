name: PR95 bounded animation diagnostic

on:
  push:
    branches: [capy/flec116-ci-host-split]
    paths: [.github/workflows/ci-animation-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: pr95-animation-diagnostic-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ubuntu-gates:
    name: Qualify portable CI gates on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact diagnostic source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact source and classify the actual push
        id: detect
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 -B Scripts/ci-docs-path.py classify \
            --repository . \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-file "$GITHUB_EVENT_PATH" \
            --source-commit "$GITHUB_SHA" \
            --output "$GITHUB_OUTPUT"
      - name: Validate exact README source using detected receipts
        env:
          DETECTED_COMMIT: ${{ steps.detect.outputs.source_commit }}
          DETECTED_TREE: ${{ steps.detect.outputs.source_tree }}
          DETECTED_VERSION: ${{ steps.detect.outputs.product_version }}
          DETECTED_WORKFLOW_SHA256: ${{ steps.detect.outputs.workflow_sha256 }}
        run: |
          python3 -B Scripts/ci-docs-path.py validate \
            --repository . \
            --source-commit "$GITHUB_SHA" \
            --expected-commit "$DETECTED_COMMIT" \
            --expected-tree "$DETECTED_TREE" \
            --expected-version "$DETECTED_VERSION" \
            --expected-workflow-sha256 "$DETECTED_WORKFLOW_SHA256" \
            --output "$GITHUB_OUTPUT"
      - name: Exercise unchanged docs and aggregate positive and negative controls
        run: python3 -B -m unittest discover -s Tests/Scripts -p test_ci_docs_path.py -v
      - name: Verify source remained pinned
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

  animation-probe:
    name: One exact ordinary animation diagnostic
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FLECK_BUILD_IDENTITY_MODE: ci-unverified
      PYTHONDONTWRITEBYTECODE: "1"
      FLECK_NATIVE_CAPTURE_QA: "0"
    steps:
      - name: Keep the runner display awake for AppKit tests
        run: |
          sudo -n pmset -a displaysleep 0 sleep 0
          pmset -g | grep -E '^ (displaysleep|sleep) '
      - name: Check out exact diagnostic source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact source and same qualification toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 74c3c697451707f94dd69530c9f234c9db9dd057 HEAD
          git diff --name-status 74c3c697451707f94dd69530c9f234c9db9dd057 HEAD
          printf 'Source tree: %s\n' "$(git rev-parse HEAD^{tree})"
          sw_vers
          uname -m
          printf 'Runner OS: %s; architecture: %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          xcodebuild -version
          swift --version
          test "$(sw_vers -productVersion)" = 26.6.2
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | head -1)" = 'Xcode 26.6'
          swift --version | grep -F 'Apple Swift version 6.3.3 '
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Execute the unchanged one-case ordinary selector once
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          Scripts/run-nonempty-swift-tests.sh \
            '^FleckAppTests\.hostedNotesPanelTabOverflowNativeDestinationMeasuresRealUnequalSourcesAndBlankTail\(\)$'
      - name: Verify source remained pinned
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
