name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test ordinary graph
        run: env -u MOTES_ENHANCED_CANDIDATE swift test --disable-automatic-resolution
      - name: Verify Enhanced Local candidate pin
        run: Scripts/test-enhanced-candidate-pin.sh
      - name: Test Enhanced Local candidate graph
        run: |
          Scripts/resolve-enhanced-candidate.sh .build-candidate \
            swift test --disable-automatic-resolution \
              --scratch-path .build-candidate
          git diff --exit-code -- Package.resolved
      - name: Build ordinary release
        run: env -u MOTES_ENHANCED_CANDIDATE swift build -c release --disable-automatic-resolution
      - name: Enforce executable size budget
        run: env -u MOTES_ENHANCED_CANDIDATE Scripts/check-release-size.sh .build/release/Motes
      - name: Preserve ordinary lock from a foreign working directory
        run: |
          Scripts/test-enhanced-candidate-lock-preservation.sh
          git diff --exit-code -- Package.resolved
      - name: Reject candidate release
        run: |
          Scripts/check-candidate-release-rejected.sh
          git diff --exit-code -- Package.resolved
