name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    name: Dictionary focus diagnostic (scratch, not for merge)
    runs-on: namespace-profile-fleck
    timeout-minutes: 60
    env:
      FLECK_NATIVE_CAPTURE_QA: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Keep the runner display awake
        run: |
          sudo -n pmset -a displaysleep 0 sleep 0
          pmset -g | grep -E '^ (displaysleep|sleep) '
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Selectors
        run: |
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
          set +e
          run() {
            echo "::group::$1"
            Scripts/run-nonempty-swift-tests.sh "$1" > /tmp/sel.log 2>&1
            status=$?
            grep -E 'DIAG|matched test count|✘|Test run with|^error' /tmp/sel.log | cut -c1-400
            echo "exit=$status"
            echo "::endgroup::"
          }
          run '^FleckAppTests\.personalDictionaryToolbarUsesPaddedTargetsInlineSearchAndKeyboardDismissal\(\)$'
          run '^FleckAppTests\.personalDictionaryPriorityStarStaysVisibleWithoutHoverAndDeleteRemainsHidden\(\)$'
          run '^FleckAppTests\.personalDictionary[A-Za-z]*\(\)$'
          run '^FleckAppTests\.FolderNavigatorPresentationTests/composingRejectsRetainedOverflowAccessibilityActions\(startAtTrailing:\)$'
          exit 0
