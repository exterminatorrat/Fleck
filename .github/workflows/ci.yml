name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_readiness_probe_only:
        description: >-
          Run only the prepared fixed supplemental diagnostic cohorts;
          required CI remains independent and fail-closed.
        required: false
        type: boolean
        default: false
      own_window_capture_probe:
        description: >-
          Run the supplemental hosted own-window capture probe; it does not replace
          required CI.
        required: false
        type: boolean
        default: false
      folder_navigator_probe:
        description: >-
          Run the supplemental folder navigator diagnostic suites; normal full-graph
          jobs remain unchanged.
        required: false
        type: boolean
        default: false
      folder_navigator_recording:
        description: >-
          Record native folder field diagnostics in supplemental folder navigator
          probes only; this does not request product or screen-capture access.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  detect-changes:
    name: Detect documentation-only changes
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.native_readiness_probe_only }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      route: ${{ steps.detect.outputs.route }}
      source_commit: ${{ steps.detect.outputs.source_commit }}
      source_tree: ${{ steps.detect.outputs.source_tree }}
      product_version: ${{ steps.detect.outputs.product_version }}
      workflow_sha256: ${{ steps.detect.outputs.workflow_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Report Namespace runner platform and toolchain
        run: |
          uname -s
          uname -m
          if [ "$(uname -s)" = Darwin ]; then
            sw_vers
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-version
            printf '%s\n' /Applications/Xcode*.app
            printf 'Launch manager: '
            launchctl managername
            printf 'Launch manager UID: '
            launchctl manageruid
            printf 'Console UID: '
            stat -f '%u' /dev/console
            if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
              printf 'GUI bootstrap domain: present\n'
            else
              printf 'GUI bootstrap domain: absent\n'
            fi
          fi
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Classify exact pull request changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 -B Scripts/ci-docs-path.py classify
          --repository .
          --event-name "$EVENT_NAME"
          --event-file "$GITHUB_EVENT_PATH"
          --source-commit "$SOURCE_COMMIT"
          --output "$GITHUB_OUTPUT"

  macos-build:
    name: macOS ordinary graph and package
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.route == 'full' }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 90
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      source_tree: ${{ steps.source.outputs.tree }}
      product_version: ${{ steps.source.outputs.version }}
    env:
      FLECK_BUILD_IDENTITY_MODE: ci-unverified
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository (actions/checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'version=%s\n' "$(cat VERSION)"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Check product version and build identity policy
        run: |
          python3 -B -m unittest discover -s Tests/Scripts -p test_build_identity.py
          python3 -B -m unittest discover -s Tests/Scripts -p test_ci_docs_path.py
          python3 -B Scripts/fleck-build-identity.py check
      - name: Test ordinary graph
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          Scripts/run-nonempty-swift-tests.sh '^.+$'
      - name: Declare native capture boundary (ordinary graph)
        if: always()
        run: |
          message='Strict native screenshot/pixel capture: NOT RUN in GitHub-hosted CI (FLECK_NATIVE_CAPTURE_QA=0).
          The strict case requires separate native-QA artifact and status-receipt evidence.
          Passing CI does not prove this case ran; this workflow does not claim full native screenshot coverage.
          All other full-graph selectors and assertions remain enabled.'
          printf '%s\n' "$message"
          {
            printf '## Native screenshot capture boundary\n\n'
            printf '%s\n\n' "$message"
            printf '%s\n' 'Separate native-QA output must include the PNGs and console status receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build Fleck release product
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          swift build -c release --product Fleck
      - name: Build agent bridge release product
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          swift build -c release --product fleck-agent
      - name: Audit agent boundary
        run: Scripts/audit-agent-boundary.sh
      - name: Test packaged app symbol stripping
        run: Tests/Scripts/build-fleck-app-symbols.test.sh
      - name: Package Fleck app
        run: |
          mkdir -p .build/ci-development-result
          result_file="$PWD/.build/ci-development-result/build-result.json"
          Scripts/build-fleck-app.sh --result-file "$result_file"
          app_path="$(Scripts/fleck-build-identity.py read-result \
            --repo "$PWD" \
            --result-file "$result_file" \
            --flavor development)"
          printf 'FLECK_APP=%s\n' "$app_path" >> "$GITHUB_ENV"
      - name: Report packaged artifact sizes and audit release contents
        run: Scripts/check-release-size.sh "$FLECK_APP"
      - name: Test release model-asset exclusion
        run: Scripts/test-release-model-asset-exclusion.sh
      - name: Verify ordinary source remained pinned
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = '${{ steps.source.outputs.tree }}'
          test "$(cat VERSION)" = '${{ steps.source.outputs.version }}'
          test -z "$(git status --porcelain)"

  macos-validation:
    name: macOS ordinary repeat and bundle validation
    needs: [detect-changes, macos-build]
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.route == 'full' }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 90
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      source_tree: ${{ steps.source.outputs.tree }}
      product_version: ${{ steps.source.outputs.version }}
    env:
      FLECK_BUILD_IDENTITY_MODE: ci-unverified
      PYTHONDONTWRITEBYTECODE: "1"
      FLECK_NATIVE_CAPTURE_QA: "0"
    steps:
      - name: Check out repository (actions/checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact workflow source
        id: source
        env:
          INITIAL_COMMIT: ${{ needs.macos-build.outputs.source_commit }}
          INITIAL_TREE: ${{ needs.macos-build.outputs.source_tree }}
          INITIAL_VERSION: ${{ needs.macos-build.outputs.product_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$INITIAL_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$INITIAL_TREE"
          test "$(cat VERSION)" = "$INITIAL_VERSION"
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'version=%s\n' "$(cat VERSION)"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Check product version and build identity policy
        run: |
          python3 -B -m unittest discover -s Tests/Scripts -p test_build_identity.py
          python3 -B Scripts/fleck-build-identity.py check
      - name: Validate macOS no-launch contract
        run: bash Tests/Scripts/validate-macos-no-launch.test.sh
      - name: Validate non-launching bundle metadata, signature, and packaging
        run: |
          unset FLECK_ENHANCED_CANDIDATE FLECK_APP
          Scripts/validate-macos.sh
      - name: Verify validation source remained pinned
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = '${{ steps.source.outputs.tree }}'
          test "$(cat VERSION)" = '${{ steps.source.outputs.version }}'
          test -z "$(git status --porcelain)"
      - name: Declare native capture boundary (ordinary validation graph)
        if: always()
        run: |
          message='Strict native screenshot/pixel capture: NOT RUN in GitHub-hosted CI (FLECK_NATIVE_CAPTURE_QA=0).
          Validation rebuilds its own ci-unverified app and result receipt; no package or cache is transferred from another job.
          Passing CI does not prove the strict native case ran.'
          printf '%s\n' "$message"
          {
            printf '## Native screenshot capture boundary\n\n'
            printf '%s\n' "$message"
          } >> "$GITHUB_STEP_SUMMARY"

  docs-validation:
    name: Validate README-only change
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.route == 'docs' }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
      source_tree: ${{ steps.validate.outputs.source_tree }}
      product_version: ${{ steps.validate.outputs.product_version }}
      workflow_sha256: ${{ steps.validate.outputs.workflow_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate exact source and README documentation
        id: validate
        env:
          DETECTED_COMMIT: ${{ needs.detect-changes.outputs.source_commit }}
          DETECTED_TREE: ${{ needs.detect-changes.outputs.source_tree }}
          DETECTED_VERSION: ${{ needs.detect-changes.outputs.product_version }}
          DETECTED_WORKFLOW_SHA256: ${{ needs.detect-changes.outputs.workflow_sha256 }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 -B Scripts/ci-docs-path.py validate
          --repository .
          --source-commit "$SOURCE_COMMIT"
          --expected-commit "$DETECTED_COMMIT"
          --expected-tree "$DETECTED_TREE"
          --expected-version "$DETECTED_VERSION"
          --expected-workflow-sha256 "$DETECTED_WORKFLOW_SHA256"
          --output "$GITHUB_OUTPUT"

  macos:
    name: macOS build and tests
    if: ${{ always() }}
    needs: [detect-changes, docs-validation, macos-build, macos-validation, macos-enhanced]
    runs-on: namespace-profile-fleck
    timeout-minutes: 90
    env:
      DETECTOR_RESULT: ${{ needs.detect-changes.result }}
      ROUTE: ${{ needs.detect-changes.outputs.route }}
      DETECTED_COMMIT: ${{ needs.detect-changes.outputs.source_commit }}
      DETECTED_TREE: ${{ needs.detect-changes.outputs.source_tree }}
      DETECTED_VERSION: ${{ needs.detect-changes.outputs.product_version }}
      DETECTED_WORKFLOW_SHA256: ${{ needs.detect-changes.outputs.workflow_sha256 }}
      DOCS_RESULT: ${{ needs.docs-validation.result }}
      DOCS_COMMIT: ${{ needs.docs-validation.outputs.source_commit }}
      DOCS_TREE: ${{ needs.docs-validation.outputs.source_tree }}
      DOCS_VERSION: ${{ needs.docs-validation.outputs.product_version }}
      DOCS_WORKFLOW_SHA256: ${{ needs.docs-validation.outputs.workflow_sha256 }}
      INITIAL_RESULT: ${{ needs.macos-build.result }}
      VALIDATION_RESULT: ${{ needs.macos-validation.result }}
      ENHANCED_RESULT: ${{ needs.macos-enhanced.result }}
      INITIAL_COMMIT: ${{ needs.macos-build.outputs.source_commit }}
      INITIAL_TREE: ${{ needs.macos-build.outputs.source_tree }}
      INITIAL_VERSION: ${{ needs.macos-build.outputs.product_version }}
      VALIDATION_COMMIT: ${{ needs.macos-validation.outputs.source_commit }}
      VALIDATION_TREE: ${{ needs.macos-validation.outputs.source_tree }}
      VALIDATION_VERSION: ${{ needs.macos-validation.outputs.product_version }}
    steps:
      - name: Require docs-only or full current-source coverage
        run: |
          set -euo pipefail
          test "$DETECTOR_RESULT" = success
          test "$DETECTED_COMMIT" = "$GITHUB_SHA"
          test -n "$DETECTED_TREE"
          test -n "$DETECTED_VERSION"
          case "$DETECTED_WORKFLOW_SHA256" in
            ""|*[!0-9a-f]*) exit 1 ;;
          esac
          test "${#DETECTED_WORKFLOW_SHA256}" -eq 64
          case "$ROUTE" in
            docs)
              test "$DOCS_RESULT" = success
              test "$INITIAL_RESULT" = skipped
              test "$VALIDATION_RESULT" = skipped
              test "$ENHANCED_RESULT" = skipped
              test "$DOCS_COMMIT" = "$DETECTED_COMMIT"
              test "$DOCS_TREE" = "$DETECTED_TREE"
              test "$DOCS_VERSION" = "$DETECTED_VERSION"
              test "$DOCS_WORKFLOW_SHA256" = "$DETECTED_WORKFLOW_SHA256"
              ;;
            full)
              test "$DOCS_RESULT" = skipped
              test "$INITIAL_RESULT" = success
              test "$VALIDATION_RESULT" = success
              test "$ENHANCED_RESULT" = success
              test -n "$INITIAL_COMMIT"
              test "$INITIAL_COMMIT" = "$DETECTED_COMMIT"
              test "$INITIAL_COMMIT" = "$GITHUB_SHA"
              test "$VALIDATION_COMMIT" = "$INITIAL_COMMIT"
              test -n "$INITIAL_TREE"
              test "$INITIAL_TREE" = "$DETECTED_TREE"
              test "$VALIDATION_TREE" = "$INITIAL_TREE"
              test -n "$INITIAL_VERSION"
              test "$INITIAL_VERSION" = "$DETECTED_VERSION"
              test "$VALIDATION_VERSION" = "$INITIAL_VERSION"
              ;;
            *)
              exit 1
              ;;
          esac

  macos-enhanced:
    name: macOS Enhanced Local candidate gates
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.route == 'full' }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 60
    steps:
      - name: Check out repository (actions/checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Verify Enhanced Local candidate pin
        run: Scripts/test-enhanced-candidate-pin.sh
      - name: Test Enhanced Local candidate graph
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
        run: |
          runner_uid="$(id -u)"
          test "$runner_uid" -ne 0
          test "$(stat -f '%u' /dev/console)" = "$runner_uid"
          /bin/launchctl print "gui/$runner_uid" >/dev/null
          native_environment=(
            "PATH=$PATH" "HOME=$HOME" "DEVELOPER_DIR=$DEVELOPER_DIR"
            "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            "FLECK_NATIVE_CAPTURE_QA=$FLECK_NATIVE_CAPTURE_QA"
          )
          if [[ ${TMPDIR+x} ]]; then
            native_environment+=("TMPDIR=$TMPDIR")
          fi
          /usr/bin/sudo -n -E /bin/launchctl asuser "$runner_uid" \
            /usr/bin/sudo -n -E -u "#$runner_uid" \
            /usr/bin/env "${native_environment[@]}" /bin/bash -euo pipefail -c '
              printf "Native test launch manager: "
              /bin/launchctl managername
              test "$(/bin/launchctl managername)" = Aqua
              test "$(id -u)" = "$(stat -f "%u" /dev/console)"
              cd "$GITHUB_WORKSPACE"
              exec Scripts/run-nonempty-enhanced-tests.sh "$@"
            ' -- '^.+$'
          git diff --exit-code -- Package.resolved
      - name: Declare native capture boundary (candidate graph)
        if: always()
        run: |
          message='Strict native screenshot/pixel capture: NOT RUN in GitHub-hosted CI (FLECK_NATIVE_CAPTURE_QA=0).
          The strict case requires separate native-QA artifact and status-receipt evidence.
          Passing CI does not prove this case ran; this workflow does not claim full native screenshot coverage.
          All other full-graph selectors and assertions remain enabled.'
          printf '%s\n' "$message"
          {
            printf '## Native screenshot capture boundary\n\n'
            printf '%s\n\n' "$message"
            printf '%s\n' 'Separate native-QA output must include the PNGs and console status receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve ordinary lock from a foreign working directory
        run: |
          Scripts/test-enhanced-candidate-lock-preservation.sh
          git diff --exit-code -- Package.resolved
      - name: Reject candidate release
        run: |
          Scripts/check-candidate-release-rejected.sh
          git diff --exit-code -- Package.resolved

  native-readiness-probe:
    name: Supplemental fixed diagnostic cohort (${{ matrix.lane }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_readiness_probe_only }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - source: 39dececc539d267bed27c179885745f8f3af45eb
            lane: host-receipt
            graph: enhanced
            expected_count: 1
            selector: '^FleckAppTests\.notesPanelConstrainedNoOpResizePreservesStoredPreferenceAndRealResizeSavesOnce\(\)$'
            expected_match_ids: |
              FleckAppTests.notesPanelConstrainedNoOpResizePreservesStoredPreferenceAndRealResizeSavesOnce()
            expected_blob_pins: |
              Scripts/run-nonempty-enhanced-tests.sh bd0e9706b5e2536ac356dac7b92f5eae2b3e6f8d
              Scripts/test-enhanced-candidate-pin.sh 3cf05fe69df708afc82df3cf5fc277048d00922d
              Scripts/run-swift-tests-with-appkit-host.sh e86b3468b3a3e0476b13934e9a317e43ca023aa4
              Tests/Support/AppKitTestMain.swift bf17ca62c02993251b381fda6ffdb323f7f2ee7d
              Tests/FleckAppTests/MenuPanelResizeTests.swift 1b58fab7194dbaa0c95ba42d4b5062b76585d67f
    env:
      TEST_SOURCE_SHA: ${{ matrix.source }}
      TEST_GRAPH: ${{ matrix.graph }}
      TEST_SELECTOR: ${{ matrix.selector }}
      EXPECTED_MATCHED_COUNT: ${{ matrix.expected_count }}
      EXPECTED_MATCH_IDS: ${{ matrix.expected_match_ids }}
      EXPECTED_BLOB_PINS: ${{ matrix.expected_blob_pins }}
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ matrix.source }}
      - name: Capture tested source and verify expected blob pins
        run: |
          set -euo pipefail
          tested_source_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tested_source_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          printf 'Hosting workflow SHA: %s\n' "$GITHUB_SHA"
          printf 'Tested source SHA: %s\n' "$TEST_SOURCE_SHA"
          test "$tested_source_commit" = "$TEST_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf 'Tested source tree: %s\n' "$tested_source_tree"
          printf 'Tested source status: clean\n'
          printf 'Fixed graph: %s\n' "$TEST_GRAPH"
          printf 'Fixed selector: %s\n' "$TEST_SELECTOR"
          printf 'Expected canonical matched count: %s\n' "$EXPECTED_MATCHED_COUNT"
          blob_pin_count=0
          while IFS=' ' read -r expected_path expected_blob extra; do
            [[ -n "$expected_path" ]] || continue
            if [[ -n "${extra:-}" || -z "${expected_blob:-}" ]]; then
              printf 'error: malformed expected blob pin for %s\n' "$expected_path" >&2
              exit 1
            fi
            case "$expected_blob" in
              *[!0-9a-f]*|'')
                printf 'error: malformed expected blob hash for %s\n' "$expected_path" >&2
                exit 1
                ;;
            esac
            test "${#expected_blob}" -eq 40
            actual_blob="$(git rev-parse --verify "$TEST_SOURCE_SHA:$expected_path")"
            if [[ "$actual_blob" != "$expected_blob" ]]; then
              printf 'error: blob mismatch for %s: expected %s, got %s\n' \
                "$expected_path" "$expected_blob" "$actual_blob" >&2
              exit 1
            fi
            printf 'Verified blob %s: %s\n' "$expected_path" "$actual_blob"
            blob_pin_count=$((blob_pin_count + 1))
          done <<< "$EXPECTED_BLOB_PINS"
          test "$blob_pin_count" -gt 0
      - name: Record runner host and toolchain metadata
        run: |
          set -euo pipefail
          uname -s
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          printf 'Launch manager name: '
          launchctl managername
          printf 'Launch manager UID: '
          launchctl manageruid
          printf 'Process UID: '
          id -u
          printf 'Console UID: '
          stat -f '%u' /dev/console
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Verify Enhanced Local candidate pin
        if: ${{ matrix.graph == 'enhanced' }}
        run: Scripts/test-enhanced-candidate-pin.sh
      - name: Run fixed diagnostic graph; verify post-run exact IDs, count and root lock
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
          FLECK_TEST_APPKIT_EXIT_CAPTURE: "1"
        run: |
          set -euo pipefail
          set +e
          run_log="$RUNNER_TEMP/fleck-native-diagnostic-${TEST_SOURCE_SHA}.log"
          case "$TEST_GRAPH" in
            enhanced)
              runner_command=(env -u EXPECTED_MATCHED_COUNT -u EXPECTED_MATCH_IDS Scripts/run-nonempty-enhanced-tests.sh "$TEST_SELECTOR")
              ;;
            ordinary)
              runner_command=(env -u EXPECTED_MATCHED_COUNT -u EXPECTED_MATCH_IDS -u FLECK_ENHANCED_CANDIDATE FLECK_FOLDER_NAVIGATOR_DIAGNOSTIC=1 Scripts/run-nonempty-swift-tests.sh "$TEST_SELECTOR")
              ;;
            *)
              printf 'error: unsupported fixed graph %s\n' "$TEST_GRAPH" >&2
              exit 64
              ;;
          esac
          "${runner_command[@]}" 2>&1 | tee "$run_log"
          pipeline_statuses=( "${PIPESTATUS[@]}" )
          runner_status="${pipeline_statuses[0]:-1}"
          capture_status="${pipeline_statuses[1]:-1}"
          expected_id_report="$(/usr/bin/awk '
            BEGIN {
              expected_line_count = split(ENVIRON["EXPECTED_MATCH_IDS"], expected_lines, "\n")
              for (line_number = 1; line_number <= expected_line_count; line_number++) {
                identifier = expected_lines[line_number]
                if (identifier == "") {
                  if (line_number < expected_line_count) {
                    malformed_expected_lines++
                  }
                  continue
                }
                expected_ids[identifier]++
                expected_id_count++
                if (expected_ids[identifier] > 1) {
                  expected_duplicates++
                }
              }
            }
            /^matched test: / {
              identifier = substr($0, 15)
              matched_count++
              if (identifier == "") {
                malformed_actual_lines++
                next
              }
              actual_ids[identifier]++
            }
            END {
              for (identifier in expected_ids) {
                if (actual_ids[identifier] == 0) {
                  missing_ids++
                }
              }
              for (identifier in actual_ids) {
                if (expected_ids[identifier] == 0) {
                  extra_ids++
                }
                if (actual_ids[identifier] > 1) {
                  duplicate_ids++
                }
              }
              printf "%d %d %d %d %d %d %d %d\n", matched_count, expected_id_count, missing_ids, extra_ids, duplicate_ids, expected_duplicates, malformed_expected_lines, malformed_actual_lines
              if (missing_ids > 0 || extra_ids > 0 || duplicate_ids > 0 || expected_duplicates > 0 || malformed_expected_lines > 0 || malformed_actual_lines > 0) {
                exit 1
              }
            }
          ' "$run_log")"
          identity_status=$?
          read -r matched_count expected_id_count missing_count extra_count duplicate_count expected_duplicate_count malformed_expected_count malformed_actual_count <<< "$expected_id_report"
          git diff --exit-code -- Package.resolved
          root_lock_status=$?
          set -e
          count_status=1
          if [[ "${matched_count:-}" == "$EXPECTED_MATCHED_COUNT" && "${expected_id_count:-}" == "$EXPECTED_MATCHED_COUNT" ]]; then
            count_status=0
          fi
          printf 'Diagnostic cohort post-run status: graph=%s runner=%s tee=%s root-lock=%s identity=%s count=%s matched=%s expected=%s expected-ids=%s missing=%s extra=%s duplicates=%s expected-duplicates=%s malformed-expected=%s malformed-actual=%s\n' \
            "$TEST_GRAPH" "$runner_status" "$capture_status" "$root_lock_status" \
            "$identity_status" "$count_status" "${matched_count:-none}" "$EXPECTED_MATCHED_COUNT" \
            "${expected_id_count:-none}" "${missing_count:-none}" "${extra_count:-none}" \
            "${duplicate_count:-none}" "${expected_duplicate_count:-none}" \
            "${malformed_expected_count:-none}" "${malformed_actual_count:-none}"
          if [[ "$runner_status" -ne 0 ]]; then
            exit "$runner_status"
          fi
          if [[ "$capture_status" -ne 0 || "$root_lock_status" -ne 0 || "$identity_status" -ne 0 || "$count_status" -ne 0 ]]; then
            exit 1
          fi

  own-window-capture-probe:
    name: Supplemental own-window capture probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.own_window_capture_probe && !inputs.native_readiness_probe_only }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare diagnostic output directory
        run: |
          FLECK_GLASS_SYNTHETIC_CAPTURE_DIR="$RUNNER_TEMP/fleck-own-window-capture-probe/captures"
          mkdir -p \
            "$RUNNER_TEMP/fleck-own-window-capture-probe" \
            "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR"
          printf 'FLECK_GLASS_SYNTHETIC_CAPTURE_DIR=%s\n' \
            "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR" >> "$GITHUB_ENV"
      - name: Log diagnostic metadata
        run: |
          set -o pipefail
          {
            printf 'Git commit SHA: '
            git rev-parse --verify HEAD
            printf 'Runner profile: namespace-profile-fleck\n'
            sw_vers
            xcodebuild -version
            swift --version
          } 2>&1 | tee "$RUNNER_TEMP/fleck-own-window-capture-probe/console.log"
      - name: Run exact own-window capture capability probe
        run: |
          set -o pipefail
          Scripts/run-nonempty-swift-tests.sh \
            '^FleckAppTests\.hostedOwnWindowCaptureCapabilityProbe\(\)$' 2>&1 |
            tee -a "$RUNNER_TEMP/fleck-own-window-capture-probe/console.log"
      - name: Verify expected probe artifact files
        if: ${{ always() }}
        run: |
          test -s "$RUNNER_TEMP/fleck-own-window-capture-probe/console.log"
          test -s "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR/glass.png"
          test -s "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR/solid.png"
      - name: Upload own-window capture diagnostics (actions/upload-artifact v7.0.1)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: own-window-capture-probe
          path: |
            ${{ runner.temp }}/fleck-own-window-capture-probe/console.log
            ${{ runner.temp }}/fleck-own-window-capture-probe/captures/
          if-no-files-found: error

  folder-navigator-diagnostic:
    name: Supplemental folder navigator diagnostic (ordinary)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.folder_navigator_probe && !inputs.native_readiness_probe_only }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FLECK_FOLDER_NAVIGATOR_DIAGNOSTIC: ${{ inputs.folder_navigator_recording && '1' || '0' }}
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify dispatched source pin
        run: |
          source_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$source_commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'Source commit: %s\n' "$source_commit"
          printf 'Source tree: %s\n' "$(git rev-parse --verify 'HEAD^{tree}')"
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Run folder navigator diagnostic tests (ordinary graph)
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          Scripts/run-nonempty-swift-tests.sh '^.*FolderNavigatorPresentationTests.*$'

  folder-navigator-diagnostic-enhanced:
    name: Supplemental folder navigator diagnostic (Enhanced)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.folder_navigator_probe && !inputs.native_readiness_probe_only }}
    runs-on: namespace-profile-fleck
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FLECK_FOLDER_NAVIGATOR_DIAGNOSTIC: ${{ inputs.folder_navigator_recording && '1' || '0' }}
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify dispatched source pin
        run: |
          source_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$source_commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'Source commit: %s\n' "$source_commit"
          printf 'Source tree: %s\n' "$(git rev-parse --verify 'HEAD^{tree}')"
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Verify Enhanced Local candidate pin
        run: Scripts/test-enhanced-candidate-pin.sh
      - name: Run folder navigator diagnostic tests (Enhanced graph)
        run: |
          Scripts/run-nonempty-enhanced-tests.sh '^.*FolderNavigatorPresentationTests.*$'
          git diff --exit-code -- Package.resolved
