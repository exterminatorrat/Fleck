name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
      - name: Enforce executable size budget
        run: Scripts/check-release-size.sh .build/release/MenuBarNotes
