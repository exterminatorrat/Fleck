name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      own_window_capture_probe:
        description: >-
          Run the supplemental hosted own-window capture probe; it does not replace
          required CI.
        required: false
        type: boolean
        default: false
      folder_navigator_probe:
        description: >-
          Run the supplemental folder navigator diagnostic suites; normal full-graph
          jobs remain unchanged.
        required: false
        type: boolean
        default: false
      folder_navigator_recording:
        description: >-
          Record native folder field diagnostics in supplemental folder navigator
          probes only; this does not request product or screen-capture access.
        required: false
        type: boolean
        default: false
      dictionary_opening_probe:
        description: >-
          Run only the exact manual personal dictionary deletion-opening boundary
          diagnostic; skips the full graph and other supplemental jobs for this dispatch.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dictionary_opening_probe }}
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FLECK_BUILD_IDENTITY_MODE: ci-unverified
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository (actions/checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Check product version and build identity policy
        run: |
          python3 -B -m unittest discover -s Tests/Scripts -p test_build_identity.py
          python3 -B Scripts/fleck-build-identity.py check
      - name: Test ordinary graph
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          Scripts/run-nonempty-swift-tests.sh '^.+$'
      - name: Declare native capture boundary (ordinary graph)
        if: always()
        run: |
          message='Strict native screenshot/pixel capture: NOT RUN in GitHub-hosted CI (FLECK_NATIVE_CAPTURE_QA=0).
          The strict case requires separate native-QA artifact and status-receipt evidence.
          Passing CI does not prove this case ran; this workflow does not claim full native screenshot coverage.
          All other full-graph selectors and assertions remain enabled.'
          printf '%s\n' "$message"
          {
            printf '## Native screenshot capture boundary\n\n'
            printf '%s\n\n' "$message"
            printf '%s\n' 'Separate native-QA output must include the PNGs and console status receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build Fleck release product
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          swift build -c release --product Fleck
      - name: Build agent bridge release product
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          swift build -c release --product fleck-agent
      - name: Audit agent boundary
        run: Scripts/audit-agent-boundary.sh
      - name: Test packaged app symbol stripping
        run: Tests/Scripts/build-fleck-app-symbols.test.sh
      - name: Package Fleck app
        run: |
          mkdir -p .build/ci-development-result
          result_file="$PWD/.build/ci-development-result/build-result.json"
          Scripts/build-fleck-app.sh --result-file "$result_file"
          app_path="$(Scripts/fleck-build-identity.py read-result \
            --repo "$PWD" \
            --result-file "$result_file" \
            --flavor development)"
          printf 'FLECK_APP=%s\n' "$app_path" >> "$GITHUB_ENV"
      - name: Report packaged artifact sizes and audit release contents
        run: Scripts/check-release-size.sh "$FLECK_APP"
      - name: Test release model-asset exclusion
        run: Scripts/test-release-model-asset-exclusion.sh
      - name: Validate macOS no-launch contract
        run: bash Tests/Scripts/validate-macos-no-launch.test.sh
      - name: Validate non-launching bundle metadata, signature, and packaging
        run: Scripts/validate-macos.sh

  macos-enhanced:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dictionary_opening_probe }}
    name: macOS Enhanced Local candidate gates
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository (actions/checkout v6.0.2)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Verify Enhanced Local candidate pin
        run: Scripts/test-enhanced-candidate-pin.sh
      - name: Test Enhanced Local candidate graph
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
        run: |
          Scripts/run-nonempty-enhanced-tests.sh '^.+$'
          git diff --exit-code -- Package.resolved
      - name: Declare native capture boundary (candidate graph)
        if: always()
        run: |
          message='Strict native screenshot/pixel capture: NOT RUN in GitHub-hosted CI (FLECK_NATIVE_CAPTURE_QA=0).
          The strict case requires separate native-QA artifact and status-receipt evidence.
          Passing CI does not prove this case ran; this workflow does not claim full native screenshot coverage.
          All other full-graph selectors and assertions remain enabled.'
          printf '%s\n' "$message"
          {
            printf '## Native screenshot capture boundary\n\n'
            printf '%s\n\n' "$message"
            printf '%s\n' 'Separate native-QA output must include the PNGs and console status receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve ordinary lock from a foreign working directory
        run: |
          Scripts/test-enhanced-candidate-lock-preservation.sh
          git diff --exit-code -- Package.resolved
      - name: Reject candidate release
        run: |
          Scripts/check-candidate-release-rejected.sh
          git diff --exit-code -- Package.resolved

  own-window-capture-probe:
    name: Supplemental own-window capture probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.own_window_capture_probe && !inputs.dictionary_opening_probe }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare diagnostic output directory
        run: |
          FLECK_GLASS_SYNTHETIC_CAPTURE_DIR="$RUNNER_TEMP/fleck-own-window-capture-probe/captures"
          mkdir -p \
            "$RUNNER_TEMP/fleck-own-window-capture-probe" \
            "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR"
          printf 'FLECK_GLASS_SYNTHETIC_CAPTURE_DIR=%s\n' \
            "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR" >> "$GITHUB_ENV"
      - name: Log diagnostic metadata
        run: |
          set -o pipefail
          {
            printf 'Git commit SHA: '
            git rev-parse --verify HEAD
            printf 'Runner image: GitHub-hosted macos-26\n'
            sw_vers
            xcodebuild -version
            swift --version
          } 2>&1 | tee "$RUNNER_TEMP/fleck-own-window-capture-probe/console.log"
      - name: Run exact own-window capture capability probe
        run: |
          set -o pipefail
          Scripts/run-nonempty-swift-tests.sh \
            '^FleckAppTests\.hostedOwnWindowCaptureCapabilityProbe\(\)$' 2>&1 |
            tee -a "$RUNNER_TEMP/fleck-own-window-capture-probe/console.log"
      - name: Verify expected probe artifact files
        if: ${{ always() }}
        run: |
          test -s "$RUNNER_TEMP/fleck-own-window-capture-probe/console.log"
          test -s "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR/glass.png"
          test -s "$FLECK_GLASS_SYNTHETIC_CAPTURE_DIR/solid.png"
      - name: Upload own-window capture diagnostics (actions/upload-artifact v7.0.1)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: own-window-capture-probe
          path: |
            ${{ runner.temp }}/fleck-own-window-capture-probe/console.log
            ${{ runner.temp }}/fleck-own-window-capture-probe/captures/
          if-no-files-found: error

  folder-navigator-diagnostic:
    name: Supplemental folder navigator diagnostic (ordinary)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.folder_navigator_probe && !inputs.dictionary_opening_probe }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FLECK_FOLDER_NAVIGATOR_DIAGNOSTIC: ${{ inputs.folder_navigator_recording && '1' || '0' }}
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify dispatched source pin
        run: |
          source_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$source_commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'Source commit: %s\n' "$source_commit"
          printf 'Source tree: %s\n' "$(git rev-parse --verify 'HEAD^{tree}')"
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Run folder navigator diagnostic tests (ordinary graph)
        run: |
          unset FLECK_ENHANCED_CANDIDATE
          Scripts/run-nonempty-swift-tests.sh '^.*FolderNavigatorPresentationTests.*$'

  folder-navigator-diagnostic-enhanced:
    name: Supplemental folder navigator diagnostic (Enhanced)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.folder_navigator_probe && !inputs.dictionary_opening_probe }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      FLECK_FOLDER_NAVIGATOR_DIAGNOSTIC: ${{ inputs.folder_navigator_recording && '1' || '0' }}
    steps:
      - name: Check out repository (actions/checkout v6.0.2, without credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Verify dispatched source pin
        run: |
          source_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$source_commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'Source commit: %s\n' "$source_commit"
          printf 'Source tree: %s\n' "$(git rev-parse --verify 'HEAD^{tree}')"
      - name: Install and verify ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
          rg --version
      - name: Verify Enhanced Local candidate pin
        run: Scripts/test-enhanced-candidate-pin.sh
      - name: Run folder navigator diagnostic tests (Enhanced graph)
        run: |
          Scripts/run-nonempty-enhanced-tests.sh '^.*FolderNavigatorPresentationTests.*$'
          git diff --exit-code -- Package.resolved

  dictionary-opening-boundary-probe:
    name: Manual personal dictionary opening-boundary probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dictionary_opening_probe == true }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Prepare diagnostic receipts
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/personal-dictionary-opening-boundary-probe"
          umask 077
          mkdir -p "$output_dir"
          printf '%s\n' 'probe_started=false' > "$output_dir/probe-status.txt"
          printf '%s\n' \
            'expected_test=FleckAppTests.personalDictionaryNativeConfirmationClaimsDeletionBeforeDismissal()' \
            > "$output_dir/expected-test.txt"
      - name: Check out exact dispatched source (actions/checkout v6.0.2, without credentials)
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dispatched source pin and diagnostic source
        id: source-pin
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/personal-dictionary-opening-boundary-probe"
          base_commit='352c019c6d6ed92eee69cd99df2f708fd08e84d5'
          expected_test_sha='5b9890178f221d909e2cb1dad9516985ed8106ef757a039b85d5cec6cd6f2ae2'
          source_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          source_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          source_test_sha="$(shasum -a 256 Tests/FleckAppTests/PersonalDictionarySettingsTests.swift | awk '{print $1}')"
          source_changes="$(git status --porcelain)"
          {
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
            printf 'HEAD_COMMIT=%s\n' "$source_commit"
            printf 'HEAD_TREE=%s\n' "$source_tree"
            printf 'TEST_FILE_SHA256=%s\n' "$source_test_sha"
            printf 'WORKTREE_CLEAN=%s\n' "$([[ -z "$source_changes" ]] && printf true || printf false)"
          } | tee "$output_dir/source-pin.txt"
          test "$source_commit" = "$GITHUB_SHA"
          test -z "$source_changes"
          test "$source_test_sha" = "$expected_test_sha"
          git merge-base --is-ancestor "$base_commit" "$source_commit"
          printf 'BASE_SOURCE_COMMIT=%s\nBASE_IS_ANCESTOR=true\n' "$base_commit" \
            | tee -a "$output_dir/source-pin.txt"
          printf 'commit=%s\ntree=%s\n' "$source_commit" "$source_tree" >> "$GITHUB_OUTPUT"
          {
            sw_vers
            xcodebuild -version
            swift --version
          } 2>&1 | tee "$output_dir/runner-environment.txt"
      - name: Run the exact ordinary diagnostic case
        env:
          FLECK_NATIVE_CAPTURE_QA: "0"
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/personal-dictionary-opening-boundary-probe"
          selector='^FleckAppTests\.personalDictionaryNativeConfirmationClaimsDeletionBeforeDismissal\(\)$'
          expected_test='FleckAppTests.personalDictionaryNativeConfirmationClaimsDeletionBeforeDismissal()'
          raw_log="$output_dir/console.log"
          : > "$raw_log"
          printf '%s\n' 'probe_started=true' > "$output_dir/probe-status.txt"
          unset FLECK_ENHANCED_CANDIDATE
          set +e
          Scripts/run-nonempty-swift-tests.sh "$selector" 2>&1 | tee "$raw_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          runner_status="${pipeline_status[0]:-127}"
          tee_status="${pipeline_status[1]:-127}"
          reported_count="$(sed -n 's/^matched test count: //p' "$raw_log" | tail -n 1)"
          exact_test_lines="$(grep -Fxc -- "matched test: $expected_test" "$raw_log" || true)"
          {
            printf 'test_script_exit=%s\n' "$runner_status"
            printf 'tee_exit=%s\n' "$tee_status"
            printf 'expected_selector=%s\n' "$selector"
            printf 'expected_test=%s\n' "$expected_test"
            printf 'reported_match_count=%s\n' "$reported_count"
            printf 'exact_test_receipt_lines=%s\n' "$exact_test_lines"
          } > "$output_dir/nonempty-runner-receipt.txt"
          printf 'test_script_exit=%s\ntee_exit=%s\n' "$runner_status" "$tee_status" \
            >> "$output_dir/probe-status.txt"
          test -s "$raw_log"
          test "$tee_status" -eq 0
          test "$reported_count" = 1
          test "$exact_test_lines" = 1
          test "$runner_status" -eq 0
      - name: Verify source remained pinned and clean
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.source-pin.outcome == 'success' }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/personal-dictionary-opening-boundary-probe"
          expected_commit='${{ steps.source-pin.outputs.commit }}'
          expected_tree='${{ steps.source-pin.outputs.tree }}'
          final_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          final_tree="$(git rev-parse --verify 'HEAD^{tree}')"
          final_changes="$(git status --porcelain)"
          {
            printf 'POST_RUN_HEAD_COMMIT=%s\n' "$final_commit"
            printf 'POST_RUN_HEAD_TREE=%s\n' "$final_tree"
            printf 'POST_RUN_WORKTREE_CLEAN=%s\n' "$([[ -z "$final_changes" ]] && printf true || printf false)"
          } | tee -a "$output_dir/source-pin.txt"
          test "$final_commit" = "$GITHUB_SHA"
          test "$final_commit" = "$expected_commit"
          test "$final_tree" = "$expected_tree"
          test -z "$final_changes"
          printf '%s\n' 'post_run_source_pin_verified=true' >> "$output_dir/probe-status.txt"
      - name: Upload opening-boundary diagnostics (actions/upload-artifact v7.0.1)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: personal-dictionary-opening-boundary-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/personal-dictionary-opening-boundary-probe/
          if-no-files-found: error
