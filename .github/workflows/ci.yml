name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test ordinary graph
        run: env -u MOTES_ENHANCED_CANDIDATE swift test
      - name: Verify Enhanced Local candidate pin
        run: |
          Scripts/test-enhanced-candidate-pin.sh
          Scripts/resolve-enhanced-candidate.sh .build-candidate
      - name: Test Enhanced Local candidate graph
        run: MOTES_ENHANCED_CANDIDATE=1 swift test --disable-automatic-resolution --scratch-path .build-candidate
      - name: Build ordinary release
        run: env -u MOTES_ENHANCED_CANDIDATE swift build -c release
      - name: Enforce executable size budget
        run: env -u MOTES_ENHANCED_CANDIDATE Scripts/check-release-size.sh .build/release/Motes
      - name: Reject candidate release
        run: Scripts/check-candidate-release-rejected.sh
