name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Observe frontmost app during full ordinary graph (scratch)
    runs-on: namespace-profile-fleck
    timeout-minutes: 80
    env:
      FLECK_NATIVE_CAPTURE_QA: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Session settings
        run: |
          pmset -g || true
          defaults -currentHost read com.apple.screensaver 2>&1 || true
          defaults read com.apple.screensaver 2>&1 || true
          sysadminctl -screenLock status 2>&1 || true
          sudo -n true && echo "passwordless sudo available" || echo "no passwordless sudo"
      - name: Full ordinary graph with frontmost observer
        run: |
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
          (
            start=$(date +%s)
            while true; do
              idle=$(ioreg -c IOHIDSystem | awk '/HIDIdleTime/ {print int($NF/1000000000); exit}')
              front=$(lsappinfo info -only name "$(lsappinfo front)" 2>/dev/null | tr -d '\n')
              echo "[observer t=$(( $(date +%s) - start ))s idle=${idle}s] $front"
              sleep 30
            done
          ) &
          observer=$!
          set +e
          Scripts/run-nonempty-swift-tests.sh '^.+$' > /tmp/full.log 2>&1
          status=$?
          kill $observer
          grep -E '✘|Test run with|^error' /tmp/full.log | cut -c1-300
          echo "exit=$status"
          exit 0
  mitigated:
    name: Full ordinary graph with idle lock disabled (scratch)
    runs-on: namespace-profile-fleck
    timeout-minutes: 80
    env:
      FLECK_NATIVE_CAPTURE_QA: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Full ordinary graph with idle lock disabled
        run: |
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
          defaults -currentHost write com.apple.screensaver idleTime -int 0
          sudo -n pmset -a displaysleep 0 sleep 0 || true
          (
            start=$(date +%s)
            while true; do
              idle=$(ioreg -c IOHIDSystem | awk '/HIDIdleTime/ {print int($NF/1000000000); exit}')
              front=$(lsappinfo info -only name "$(lsappinfo front)" 2>/dev/null | tr -d '\n')
              echo "[observer t=$(( $(date +%s) - start ))s idle=${idle}s] $front"
              sleep 30
            done
          ) &
          observer=$!
          set +e
          caffeinate -dimsu -w $$ &
          Scripts/run-nonempty-swift-tests.sh '^.+$' > /tmp/full.log 2>&1
          status=$?
          kill $observer
          grep -E '✘|Test run with|^error' /tmp/full.log | cut -c1-300
          echo "exit=$status"
          exit 0
