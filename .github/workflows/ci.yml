name: CI
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Diagnostic selector; neither mode replaces required CI
        type: choice
        default: readiness
        options:
          - readiness
          - models-click
          - capsule-posted
permissions:
  contents: read
jobs:
  diagnostic:
    name: Readiness focus seam diagnostic only
    runs-on: namespace-profile-fleck
    timeout-minutes: 30
    env:
      FLECK_NATIVE_CAPTURE_QA: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Establish disposable runner keyboard test environment
        run: |
          sudo -n pmset -a displaysleep 0 sleep 0
          if [[ '${{ inputs.probe }}' == readiness ]]; then
            defaults write -g AppleKeyboardUIMode -int 3
          fi
          defaults read -g AppleKeyboardUIMode || true
          sw_vers
          xcodebuild -version
          swift --version
          git rev-parse HEAD HEAD^{tree}
      - name: Compare actual focus and anchored cue state
        if: ${{ inputs.probe == 'readiness' }}
        run: |
          export FLECK_SETTINGS_WINDOW_CAPTURE_DIR="$RUNNER_TEMP/readiness-seam-captures"
          Scripts/run-nonempty-swift-tests.sh '^FleckAppTests\.(DictationSettingsReadinessPopoverIsAccessibleAtMinimumWindowSize\(\)|SettingsSearchProbeKeepsPrivateIdentityWhenAccessibilityIdentifierChanges\(\)|SettingsSearchConnectsGlobalResultsToExistingControlAnchors\(\)|DictationSettingsOpenModelsAndSearchNavigateIntoTheSamePane\(\)|settingsSearchAnchorFocusCueDistinguishesTabFromPointer\(\)|SettingsSearchTests/.+)$' > "$RUNNER_TEMP/readiness-seam.log" 2>&1
          grep -F 'Readiness full keyboard access: true' "$RUNNER_TEMP/readiness-seam.log"
      - name: Observe the exact owned Models click route
        if: ${{ inputs.probe == 'models-click' }}
        run: |
          Scripts/run-nonempty-swift-tests.sh '^FleckAppTests\.modelSearchBlursWithoutSwallowingActionsAcrossThemesAndSizes\(\)$' > "$RUNNER_TEMP/models-click-route.log" 2>&1
          grep -F 'MODELS_CLICK_PROBE_INSTALL class=AppKitTestProbeApplication exactPrincipalClass=true beforeTestBundle=true' "$RUNNER_TEMP/models-click-route.log"
      - name: Observe the exact posted capsule coordinate route
        if: ${{ inputs.probe == 'capsule-posted' }}
        run: |
          Scripts/run-nonempty-swift-tests.sh '^FleckAppTests\.DictationCapsulePostedEventRetryQualification\(\)$' > "$RUNNER_TEMP/capsule-posted-route.log" 2>&1
          grep -F 'posted-coordinate-probe v=1 stage=post-sequence' "$RUNNER_TEMP/capsule-posted-route.log"
      - name: Report diagnostic observations without final validation claim
        if: always()
        run: |
          for trace in "$RUNNER_TEMP/readiness-seam.log" "$RUNNER_TEMP/models-click-route.log" "$RUNNER_TEMP/capsule-posted-route.log"; do
            if [[ -f "$trace" ]]; then
              grep -E 'posted-coordinate-probe|posted-down-witness|MODELS_CLICK_PROBE|SEAM|F93-readiness|Readiness full keyboard|matched test count|Test run with|^error:|✘|✔ Test' "$trace" || true
            fi
          done
          printf '%s\n' 'Diagnostic only: no required full graph, package, or product validation verdict.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve synthetic seam captures and raw trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-seam-evidence
          path: |
            ${{ runner.temp }}/readiness-seam.log
            ${{ runner.temp }}/readiness-seam-captures
            ${{ runner.temp }}/models-click-route.log
            ${{ runner.temp }}/capsule-posted-route.log
