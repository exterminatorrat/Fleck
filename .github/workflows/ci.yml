name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    name: Readiness focus-return diagnostic (scratch, not for merge)
    runs-on: namespace-profile-fleck
    timeout-minutes: 60
    env:
      FLECK_NATIVE_CAPTURE_QA: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Keep the runner display awake
        run: |
          sudo -n pmset -a displaysleep 0 sleep 0
          pmset -g | grep -E '^ (displaysleep|sleep) '
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify diagnostic source and prepare screenshots
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          capture_dir="$RUNNER_TEMP/readiness-captures"
          mkdir -p "$capture_dir"
          printf 'FLECK_SETTINGS_WINDOW_CAPTURE_DIR=%s\n' \
            "$capture_dir" >> "$GITHUB_ENV"
          printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
          printf 'source_tree=%s\n' "$(git rev-parse HEAD^{tree})"
      - name: Run readiness focus-return selector
        run: |
          if ! command -v rg >/dev/null 2>&1; then brew install ripgrep; fi
          set +e
          Scripts/run-nonempty-swift-tests.sh \
            '^FleckAppTests\.DictationSettingsReadinessPopoverIsAccessibleAtMinimumWindowSize\(\)$' \
            > /tmp/readiness-selector.log 2>&1
          status=$?
          grep -E '\[F93-readiness|matched test count|✘|Test run with|^error' \
            /tmp/readiness-selector.log | cut -c1-400 || true
          echo "selector_exit=$status"
          exit "$status"
      - name: Print readiness focus trace
        if: always()
        run: |
          if [ -f /tmp/readiness-selector.log ]; then
            grep -E '\[F93-readiness|matched test count|✘|Test run with|^error' \
              /tmp/readiness-selector.log | cut -c1-400 || true
          fi
      - name: Upload readiness focus captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: readiness-focus-return-captures
          path: ${{ runner.temp }}/readiness-captures/
          if-no-files-found: warn
