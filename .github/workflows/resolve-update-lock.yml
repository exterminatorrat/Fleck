name: Resolve exact updater lock

on:
  push:
    branches: [capy/update-information-public]
    paths: [.github/workflows/resolve-update-lock.yml]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: namespace-profile-fleck
    timeout-minutes: 15
    steps:
      - name: Check out exact updater graph
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 28c7bb9908b515d3665b71835d37feeb4473ea46
          persist-credentials: false
      - name: Verify resolver inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 28c7bb9908b515d3665b71835d37feeb4473ea46
          test -z "$(git status --porcelain)"
          printf '%s\n' '2bee39e00f80f26a585a7dfb6ee4a989dc4c43d176afb9a0fc8c2a983502e9f0  Package.swift' | shasum -a 256 -c -
          printf '%s\n' 'ccf30f62d44719e9859266a373bb0219dbbd1e0f73d17667b50d7d87715a09f7  Package.resolved' | shasum -a 256 -c -
          cp Package.resolved "$RUNNER_TEMP/updater-lock-before.json"
          swift --version
      - name: Resolve exact default graph without dependency updates
        shell: bash
        run: |
          set -euo pipefail
          env -u FLECK_ENHANCED_CANDIDATE -u FLECK_BUILD_WITHOUT_SPARKLE swift package resolve
      - name: Verify preserved pins and record generated lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          old = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'updater-lock-before.json').read_bytes())
          new = json.loads(pathlib.Path('Package.resolved').read_bytes())
          old_pins = {pin['identity']: pin for pin in old['pins']}
          new_pins = {pin['identity']: pin for pin in new['pins']}
          assert len(old_pins) == len(old['pins']) == 7
          assert len(new_pins) == len(new['pins']) == 8
          assert set(new_pins) == set(old_pins) | {'sparkle'}
          for identity, pin in old_pins.items():
              assert new_pins[identity] == pin, identity
          sparkle = new_pins['sparkle']
          assert sparkle['kind'] == 'remoteSourceControl'
          assert sparkle['location'] == 'https://github.com/sparkle-project/Sparkle'
          assert sparkle['state'] == {'version': '2.10.0', 'revision': 'eef1a539a373c1f1a320624b1130fc5de7b2e100'}
          assert new['version'] == old['version']
          assert re.fullmatch('[0-9a-f]{64}', new['originHash'])
          assert new['originHash'] != old['originHash']
          assert subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() == ['Package.resolved']
          manifest_hash = hashlib.sha256(pathlib.Path('Package.swift').read_bytes()).hexdigest()
          assert manifest_hash == '2bee39e00f80f26a585a7dfb6ee4a989dc4c43d176afb9a0fc8c2a983502e9f0'
          receipt = {
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'manifestSHA256': manifest_hash,
              'resolvedSHA256': hashlib.sha256(pathlib.Path('Package.resolved').read_bytes()).hexdigest(),
              'originHash': new['originHash'],
              'preservedPinCount': len(old_pins),
              'sparkle': sparkle,
          }
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'updater-lock-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload generated lock and exact-source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: updater-root-lock
          path: |
            Package.resolved
            ${{ runner.temp }}/updater-lock-receipt.json
          if-no-files-found: error
          retention-days: 7
